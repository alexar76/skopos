services:
  skopos:
    build: .
    container_name: aicom-skopos
    env_file:
      - .env
    ports:
      - "127.0.0.1:8501:8501"
      - "127.0.0.1:8502:8502"
    volumes:
      - ./servers.yaml:/app/servers.yaml:ro
      - ./agent.yaml:/app/agent.yaml:ro
      - ./skopos.sqlite3:/app/skopos.sqlite3
      # Collector keys only — one per monitored host, generated by
      # `python skoposctl.py provision`. Do NOT mount ~/.ssh here: it would hand
      # the container every key you own, including ones that open hosts SKOPOS
      # has no business touching.
      - ./ssh:/root/.ssh:ro
    environment:
      - SKOPOS_SSH_KEY_PASSPHRASE=${SKOPOS_SSH_KEY_PASSPHRASE:-}
      - SKOPOS_DASHBOARD_PASSWORD=${SKOPOS_DASHBOARD_PASSWORD:-}
      - SKOPOS_SSH_STRICT_HOST_KEYS=${SKOPOS_SSH_STRICT_HOST_KEYS:-1}
      - SKOPOS_KNOWN_HOSTS=/root/.ssh/known_hosts
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

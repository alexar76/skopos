name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-asyncio
          pip install -e .
          # Remediation / A2A tests need FastAPI + oracle signing (+ momus peer in satellite CI).
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.34" "aimarket-momus>=0.1.0"
          if [ -d vendor/oracle-core ]; then
            pip install -e vendor/oracle-core
          else
            pip install "aimarket-oracle-core>=0.2"
          fi
          cp servers.example.yaml servers.yaml
          cp agent.example.yaml agent.yaml

      - name: Pytest + coverage
        run: |
          python3 -m pytest tests/ -q --cov=skopos --cov-report=term-missing --cov-report=json:coverage.json --tb=short --maxfail=5
          python3 scripts/generate_coverage_badge.py coverage.json docs/badges/coverage.svg
          echo "Coverage badge (informational): $(grep -o '[0-9]*%' docs/badges/coverage.svg | tail -1)"
          python3 scripts/generate_tests_badge.py --rootdir . --out docs/badges/tests.json
          echo "Tests badge (informational): $(python3 -c "import json;print(json.load(open('docs/badges/tests.json'))['message'])")"
